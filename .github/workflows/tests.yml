name: PartyUp tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      PARTYUP_TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.3
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: uv run --no-sync ruff check app scripts tests
      - run: uv run --no-sync pytest -q
