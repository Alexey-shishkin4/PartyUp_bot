[project]
name = "partyup-bot"
version = "0.1.0"
description = "Telegram знакомства для геймеров: Steam, взаимные лайки и рекомендации"
requires-python = ">=3.10"
dependencies = [
  "aiogram>=3.20,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<2.1", "httpx>=0.27,<1", "pydantic-settings>=2.5,<3",
  "tzdata>=2025.1", "numpy>=2,<3", "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
